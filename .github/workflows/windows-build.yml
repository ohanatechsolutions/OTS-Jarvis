name: Windows Pilot Build (manual, no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned packaging tool
        run: python -m pip install "pyinstaller==6.15.0"
      - name: Test and package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test local HTTP endpoint
        shell: pwsh
        run: |
          $env:JARVIS_PORT = '18745'
          $env:JARVIS_DATA_DIR = "$env:RUNNER_TEMP\jarvis-smoke"
          $proc = Start-Process -FilePath 'dist/OTS-Jarvis.exe' -ArgumentList '--no-browser' -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $result = Invoke-RestMethod 'http://127.0.0.1:18745/api/health' -TimeoutSec 2
                if ($result.status -eq 'ok') { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Bundled application HTTP smoke test failed' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Record binary hash
        shell: pwsh
        run: (Get-FileHash 'dist/OTS-Jarvis.exe' -Algorithm SHA256).Hash | Out-File 'dist/OTS-Jarvis.exe.sha256'
      - name: Independently verify the packaged executable and SHA-256
        shell: pwsh
        run: |
          $file = 'dist/OTS-Jarvis.exe'
          $hashFile = 'dist/OTS-Jarvis.exe.sha256'
          if (-not (Test-Path $file) -or -not (Test-Path $hashFile)) { throw 'Missing executable or checksum' }
          $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          $expected = (Get-Content -LiteralPath $hashFile -Raw).Trim()
          if ($expected -notmatch '^[a-fA-F0-9]{64}
        with:
          name: OTS-Jarvis-Windows-pilot-unsigned
          path: |
            dist/OTS-Jarvis.exe
            dist/OTS-Jarvis.exe.sha256
          if-no-files-found: error
 -or $actual -ne $expected) { throw 'Executable checksum mismatch' }
          if ((Get-Item $file).Length -lt 100000) { throw 'Executable is suspiciously small' }
          Write-Host 'Executable size and SHA-256 verified against the build output'
      - name: Sign build provenance attestation
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/OTS-Jarvis.exe'
      - name: Independently verify GitHub artifact attestation
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify 'dist/OTS-Jarvis.exe' --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Build provenance attestation could not be verified' }
      - uses: actions/upload-artifact@v4
        with:
          name: OTS-Jarvis-Windows-pilot-unsigned
          path: |
            dist/OTS-Jarvis.exe
            dist/OTS-Jarvis.exe.sha256
          if-no-files-found: error
